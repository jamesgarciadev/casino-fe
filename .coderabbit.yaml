# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews pull requests on GitHub. Reference: https://docs.coderabbit.ai/reference/configuration
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  estimate_code_review_effort: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!package-lock.json"
    # Generated by `npm run codegen` from casino-be's schema; review the schema change instead.
    - "!src/gql/**"
  path_instructions:
    - path: "src/app/**"
      instructions: |
        Next.js 16 with Cache Components, which differs from older versions: check node_modules/next/dist/docs before
        suggesting APIs. Hiding a section or button for a role is UX only: casino-be authorizes every query and mutation,
        so never rely on the client to enforce access.
    - path: "src/lib/**"
      instructions: |
        The admin token stays in the httpOnly, SameSite=strict cookie and on the server. The browser only calls the
        same-origin /api/graphql proxy. Mutations are Server Actions and validate input with Zod.
    - path: "src/components/**"
      instructions: |
        casino-sim's service account is shown read-only. Role changes are owner-only and audit-logged by be.
    - path: "e2e/**"
      instructions: |
        Playwright tests avoid fixed sleeps and create their own data (createCustomer in e2e/support.ts, using
        @example.com) so searches for demo accounts stay stable.
  tools:
    gitleaks:
      enabled: true
    # Our docs wrap at 120 columns and use wide tables, which the default markdownlint rules reject.
    markdownlint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "ARCHITECTURE.md"
